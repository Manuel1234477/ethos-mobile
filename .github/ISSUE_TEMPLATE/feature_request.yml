name: Feature request
description: Suggest a change or a new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Backend, CI/Scripts, Other]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0-Critical, P1-High, P2-Medium, P3-Low]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed change
    validations:
      required: true
