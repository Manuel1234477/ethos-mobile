name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ios/EthosProtocol

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Runs before any Xcode toolchain/build work: this only needs the
      # checked-out sources (the script itself + the target Info.plists),
      # not a live certificate or a build product, so it fails fast and
      # cheaply if it's going to fail at all.
      - name: Test TLS pinning check script
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      # Guards against #117's TLS_PUBLIC_KEY_PINS regressing to absent/empty
      # (silently disabling certificate pinning) in a Release build, or a new
      # target being added without it. EthosProtocol and TTLWidget each read
      # Bundle.main independently (an app extension does not inherit its host
      # app's Info.plist — see project.yml), so both are checked. This is
      # deliberately scoped to the Release configuration only — Debug is left
      # untouched, matching PinningDelegate's documented "empty pins disables
      # pinning for local dev" design (see check_tls_pinning.py).
      - name: Verify TLS certificate pinning is configured (Release)
        env:
          ETHOS_CERTIFICATE_EXPIRY: ${{ vars.ETHOS_CERTIFICATE_EXPIRY }}
        run: |
          ARGS=(
            --configuration Release
            --target "EthosProtocol:EthosProtocol/Info.plist"
            --target "TTLWidget:TTLWidget/Info.plist"
          )
          if [ -n "$ETHOS_CERTIFICATE_EXPIRY" ]; then
            ARGS+=(--certificate-expiry "$ETHOS_CERTIFICATE_EXPIRY")
          fi

          python3 "$GITHUB_WORKSPACE/.github/scripts/check_tls_pinning.py" "${ARGS[@]}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      # A hard-coded `name=<device>,OS=latest` destination breaks whenever the runner image
      # changes: `OS=latest` can resolve to a runtime that is not installed, and a device
      # model can disappear from the image entirely — both produce "Unable to find a device
      # matching the provided destination specifier" with no code change on our side.
      # Resolving the newest available iPhone simulator to a concrete UDID pins the test
      # steps below to a device that actually exists on whatever `macos-latest` is today.
      # `simctl` lists runtimes in ascending version order, so the last iPhone entry belongs
      # to the newest installed iOS runtime.
      - name: Select iOS Simulator destination
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available \
            | sed -n '/^-- iOS/,$p' \
            | grep -E '^ +iPhone' \
            | tail -1)
          UDID=$(echo "$SIMULATOR" | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')

          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found on this runner image."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator:$SIMULATOR"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Show SwiftPM dependency graph
        run: swift package show-dependencies

      # continue-on-error: this action hard-requires the repo's "Dependency graph"
      # setting (Settings > Security > Code security and analysis), which isn't
      # enabled here — every run fails immediately with "Dependency review is not
      # supported on this repository," regardless of what a PR actually changes.
      # That's a repo-config gap, not a real finding, so it shouldn't block every
      # PR; re-tighten this once Dependency graph is enabled for the repo.
      - name: Review dependency changes for high severity vulnerabilities
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        # Non-blocking: dependency-review requires the Dependency graph feature
        # to be enabled in repo settings (Settings → Security → Code security).
        # If it is disabled the action errors with "not supported on this
        # repository" — the dependency graph must be enabled for this check.
        with:
          fail-on-severity: high
          license-check: false

      # Runs the existing EthosProtocolTests XCTest target against the SPM
      # package (Package.swift) — deliberately BEFORE the Xcode project is
      # generated below (see below for why order matters).
      #
      # Uses the "EthosProtocol-Package" scheme, not "EthosProtocol": SwiftPM
      # auto-generates one scheme per *product* plus one aggregate
      # "<manifest-name>-Package" scheme covering every target in the
      # manifest. EthosProtocolTests depends on both the EthosProtocol and
      # TTLWidget products, so Xcode doesn't attach it to either product's
      # own scheme — only the aggregate scheme has a test action configured.
      # ("xcodebuild test -scheme EthosProtocol" fails with "Scheme
      # EthosProtocol is not currently configured for the test action.")
      #
      # This step also has to run before Xcode/EthosProtocol.xcodeproj is
      # generated below: once that project exists on disk, xcodebuild's
      # implicit scheme discovery (no -project/-workspace passed) resolves
      # to its app target scheme, which is also named "EthosProtocol" and
      # also has no test action — a second, unrelated way to hit the same
      # error. Running tests first avoids that ambiguity entirely.
      #
      # `swift test` isn't used here because several files import iOS-only
      # frameworks (BackgroundTasks, WidgetKit, UIKit) that don't compile
      # for swift test's default macOS host destination.
      - name: Test (iOS Simulator)
        # GitHub Actions sets CI=true for this shell, but that does NOT reach
        # the Simulator-hosted xctest process — it runs in its own sandboxed
        # environment, not inherited from the invoking shell. xcodebuild's
        # documented TEST_RUNNER_ prefix is what actually forwards a variable
        # into the test host (stripping the prefix), which is what
        # EthosProtocolTests.swift / ICloudSyncServiceTests.swift check via
        # ProcessInfo.processInfo.environment["CI"] to skip tests that need a
        # signed, hosted app process (Keychain / UNUserNotificationCenter /
        # NSUbiquitousKeyValueStore) that a bare SPM test bundle doesn't have.
        run: |
          TEST_RUNNER_CI=true xcodebuild test \
            -scheme EthosProtocol-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipMacroValidation \
            -enableCodeCoverage YES

      - name: Collect code coverage (SPM tests)
        working-directory: ios/EthosProtocol
        run: |
          PROFDATA=$(find ~/Library/Developer/Xcode/DerivedData -name "default.profdata" -type f -print -quit 2>/dev/null || true)
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -name "EthosProtocol" -type f -print -quit 2>/dev/null || true)

          if [ -z "$PROFDATA" ] || [ -z "$BINARY" ]; then
            echo "::warning::Code coverage data collection skipped (profdata or binary not found)"
            exit 0
          fi

          xcrun llvm-cov export \
            -ignore-filename-regex=".build" \
            -format=lcov \
            -instr-profile="$PROFDATA" \
            "$BINARY" \
            > coverage.lcov 2>/dev/null

          xcrun llvm-cov export \
            -ignore-filename-regex=".build" \
            -json \
            -instr-profile="$PROFDATA" \
            "$BINARY" \
            > coverage.json 2>/dev/null

      - name: Check code coverage threshold (40% minimum for SPM)
        working-directory: ios/EthosProtocol
        run: |
          python3 << 'EOF'
          import json
          import sys

          THRESHOLD = 40

          try:
              with open('coverage.json', 'r') as f:
                  data = json.load(f)
          except FileNotFoundError:
              print("::warning::coverage.json not found — coverage check skipped (profdata unavailable on this runner)")
              sys.exit(0)
          except json.JSONDecodeError as e:
              print(f"::error::Failed to parse coverage.json: {e}")
              sys.exit(1)

          try:
              coverage = data['data'][0]['totals']['lines']['percent']
          except (KeyError, IndexError):
              print("::warning::Unexpected coverage.json structure — check skipped")
              sys.exit(0)

          print(f"iOS SPM code coverage: {coverage:.1f}%")
          if coverage < THRESHOLD:
              print(f"::error::Code coverage ({coverage:.1f}%) is below the {THRESHOLD}% minimum threshold. Please add tests.")
              sys.exit(1)
          else:
              print(f"✓ Code coverage meets minimum threshold ({THRESHOLD}%)")
          EOF

      - name: Upload iOS coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ios/EthosProtocol/coverage.lcov
          flags: ios
          name: ios-spm
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Assert VaultWebSocketClient stub is gone (#179)
        # Fails the build if any Swift source file still references the deleted
        # VaultWebSocketClient stub (class name or its event type). This is a
        # dead-code guard: if the stub is accidentally re-introduced or a new
        # reference is added, CI catches it immediately.
        run: |
          if grep -r "VaultWebSocketClient" --include="*.swift" .; then
            echo "ERROR: VaultWebSocketClient found in Swift sources — the stub was removed in #179 and must not be re-introduced."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # Generates Xcode/EthosProtocol.xcodeproj from project.yml — the real,
      # installable app target (+ TTLWidget extension), which Package.swift
      # alone cannot produce (it only declares library products).
      - name: Generate Xcode project (XcodeGen)
        # XcodeGen stages the new .xcodeproj in a temp dir and copies it into
        # the --project destination — it does not create that destination
        # directory itself, so `Xcode/` must exist first or the copy fails
        # with a confusing "source file doesn't exist" Cocoa error.
        run: |
          mkdir -p Xcode
          xcodegen generate --project Xcode

      # Builds the real installable app + embedded widget extension, from the
      # XcodeGen-generated project — not just the library, as the previous
      # version of this job did.
      - name: Build app (iOS Simulator)
        run: |
          xcodebuild build \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation

      - name: Measure app size
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/track_build_size.py" ios

      # Runs hosted tests that require a real app process (Keychain, UNUserNotificationCenter).
      # These tests are in EthosProtocolTests target within the Xcode project, not in the SPM
      # test bundle, because they need TEST_HOST (real app host entitlements/process).
      # Test results from the SPM tests (above) + hosted tests (here) combine to give full CI coverage.
      #
      # Tests that read back real pending UNUserNotificationCenter requests need notification
      # authorization already granted, which a simulator never prompts for (no user to tap
      # Allow) — `xcrun simctl privacy <udid> grant notifications <bundle-id>` was tried here
      # to pre-grant it, but fails outright on this runner ("Operation not permitted"/"Failed
      # to set access"), a simulator/CI limitation rather than something this repo controls.
      # Those specific tests are XCTSkipIf(CI)-guarded instead (see KeychainAndNotificationTests.swift).
      - name: Test (Keychain & Notifications - Hosted, iOS Simulator)
        run: |
          TEST_RUNNER_CI=true xcodebuild test \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocolTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipMacroValidation

  # ── UI Automation Tests (#441) ────────────────────────────────────────────
  # Runs the XCUITest suite (Tests/UI/) against a booted iOS Simulator.
  #
  # This job is intentionally marked continue-on-error: true for two reasons:
  #   1. XCUITest requires the app to be installed and running inside a fully
  #      booted simulator. In certain macos-latest runner configurations the
  #      simulator environment is non-deterministically unavailable, causing
  #      spurious failures that don't reflect real regressions.
  #   2. Several tests are auth-gated and skip gracefully when the app doesn't
  #      support the UI_TEST_MOCK_AUTHENTICATED launch-environment flag yet.
  #      Once the app-side mock-auth support is in place, this flag can be
  #      tightened (continue-on-error: false) to enforce the full suite.
  #
  # The job always runs after build-and-test (needs:) so it never starts
  # against a build that is already known to be broken.
  ui-tests:
    needs: build-and-test
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ios/EthosProtocol
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Resolve the newest available iPhone simulator to a concrete UDID.
      # Using a hard-coded "OS=latest" destination breaks whenever the runner
      # image changes and a runtime disappears — the same approach used in
      # build-and-test avoids that fragility.
      - name: Select iOS Simulator destination
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available \
            | sed -n '/^-- iOS/,$p' \
            | grep -E '^ +iPhone' \
            | tail -1)
          UDID=$(echo "$SIMULATOR" | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')

          if [ -z "$UDID" ]; then
            echo "::warning::No available iPhone simulator found — UI tests will be skipped."
            echo "udid=" >> "$GITHUB_OUTPUT"
          else
            echo "Using simulator: $SIMULATOR"
            echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # The XcodeGen-generated project is required for xcodebuild to resolve
      # the EthosProtocol *app* scheme (the SPM Package.swift only produces
      # library products, not an installable .app that XCUITest can launch).
      - name: Generate Xcode project (XcodeGen)
        run: |
          mkdir -p Xcode
          xcodegen generate --project Xcode

      # Boot the simulator explicitly before xcodebuild so it is ready when
      # the test process tries to install the app. Without this, xcodebuild
      # sometimes times out waiting for the simulator to finish booting.
      - name: Boot simulator
        if: steps.simulator.outputs.udid != ''
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      # Run only the UI test target. The -only-testing flag scopes xcodebuild
      # to the EthosProtocolUITests bundle so unit tests are not re-executed
      # here (they ran in build-and-test above).
      #
      # UI_TEST_MOCK_AUTHENTICATED is forwarded as a TEST_RUNNER_ variable so
      # the simulator-hosted app process receives it. This is the same pattern
      # used for TEST_RUNNER_CI in the hosted unit-test step above.
      - name: Run UI Tests (iOS Simulator)
        if: steps.simulator.outputs.udid != ''
        run: |
          TEST_RUNNER_UI_TEST_MOCK_AUTHENTICATED=1 \
          TEST_RUNNER_UI_TEST_SEED_VAULTS=1 \
          xcodebuild test \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:EthosProtocolUITests \
            -skipMacroValidation \
            -resultBundlePath ui-test-results.xcresult
