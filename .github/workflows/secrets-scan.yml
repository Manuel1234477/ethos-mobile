name: Secrets Scan

# Runs gitleaks on every push and pull request. Pre-commit hooks can be skipped
# with --no-verify or by contributors who do not have them installed, so the
# scan also runs here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the repository history and tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose
