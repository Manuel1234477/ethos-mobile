name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate redaction allowlist against shared contract
        run: python3 scripts/check-redaction-allowlist.py --platform android

      - name: Build and test
        working-directory: android
        run: ./gradlew build test
