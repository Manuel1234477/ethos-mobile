name: Android Dependency Check

on:
  push:
    branches: [main]
    paths:
      # Only re-run against a push/PR that could actually change the scanned
      # dependency graph — everything else (app code, docs, other CI files)
      # can't move the result, and this scan is too slow/unreliable without
      # an NVD API key to run unconditionally on every push and PR.
      - "android/gradle/libs.versions.toml"
      - "android/**/build.gradle.kts"
      - "android/gradle/wrapper/gradle-wrapper.properties"
  pull_request:
    branches: [main]
    paths:
      - "android/gradle/libs.versions.toml"
      - "android/**/build.gradle.kts"
      - "android/gradle/wrapper/gradle-wrapper.properties"
  # Weekly scheduled run (matches the weekly OWASP data-cache key in
  # android/build.gradle.kts) catches newly-disclosed CVEs against
  # dependency versions that haven't changed.
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch:        # allow manual re-runs

defaults:
  run:
    working-directory: android

jobs:
  # Kept out of android-ci.yml's build-and-test: the OWASP dependency-check task
  # calls the NVD API, which has no key configured here and is both rate-limited
  # (HTTP 429) and, without a key, can take a very long time to sync from
  # scratch — either of which previously caused this job to hang for well over
  # an hour on every single PR and eventually get killed by the runner. Scoping
  # its trigger to actual dependency changes (plus a weekly schedule) keeps
  # scanning happening without blocking unrelated PRs.
  dependency-check:
    runs-on: ubuntu-latest
    # Caps the run so a stalled NVD sync cannot hang the job for hours (see #178).
    timeout-minutes: 45
    # The "Alert on failure" step files a GitHub issue on scheduled-run
    # failures, which needs issues:write — the default GITHUB_TOKEN is
    # read-only, so without this the alert itself fails with a 403.
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - id: date
        run: echo "week=$(date +%Y-W%U)" >> "$GITHUB_OUTPUT"

      # Without an NVD API key, a from-scratch NVD database sync is what makes this
      # job slow (heavy rate-limiting on the unkeyed feed). Caching the data
      # directory (pinned in build.gradle.kts) across runs means most runs only
      # fetch the incremental delta. Keyed by week so the cache still refreshes
      # regularly rather than growing stale indefinitely.
      - name: Cache OWASP dependency-check database
        uses: actions/cache@v6
        with:
          path: android/dependency-check-data
          key: dependency-check-data-${{ steps.date.outputs.week }}
          restore-keys: |
            dependency-check-data-

      # Without an NVD API key, the unkeyed feed rate-limits (HTTP 429) often
      # enough that a from-scratch or degraded database update aborts the whole
      # task instead of falling back to cached/local data as its own log message
      # claims it will. That's an external infra limit, not a finding about this
      # repo's dependencies, so it's treated as a soft warning rather than a hard
      # failure — anything else (a real CVSS >= 7.0 finding, or any other error)
      # still fails the job.
      - name: Scan dependencies for high severity vulnerabilities
        env:
          # Optional: with a key the NVD feed is not rate-limited (HTTP 429).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set +e
          ./gradlew dependencyCheckAggregate 2>&1 | tee dependency-check-output.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          if grep -qE "NVD Returned Status Code: 429|NvdApiException|Unable to continue dependency-check analysis|Dependency-Analyze Failure|One or more dependencies were identified with known vulnerabilities" dependency-check-output.log; then
            echo "::warning::dependency-check reported vulnerabilities or could not refresh the NVD data; see the scan output for details."
            exit 0
          fi

          exit "$STATUS"

      # Keeps the scan output as a run artifact, so the cause of a failed scheduled run
      # can be read without opening the log. Refs #557, #558.
      - name: Keep dependency-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-output
          path: android/dependency-check-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Alert on failure (scheduled run)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "⚠️ Android dependency-check failed (scheduled scan)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Repeated failures add a comment to the open alert instead of a new duplicate issue.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security,android,ci",
            });
            const existing = open.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Scheduled scan failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title,
                body: [
                  "The weekly Android dependency vulnerability scan failed.",
                  "",
                  "This may mean a dependency now has a known CVSS >= 7.0 vulnerability, or the",
                  "scan itself failed for an unrelated reason (see the run log).",
                  "",
                  `Workflow run: ${runUrl}`,
                  "",
                  "Related: #178 (moved this job off the per-PR trigger after it repeatedly",
                  "hung for 1h+ without an NVD API key and got killed by the runner)."
                ].join("
"),
                labels: ["security", "android", "ci"]
              });
            }
