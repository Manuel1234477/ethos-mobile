name: Cross-Platform E2E

# Runs on a schedule (not every PR) because these tests:
#   - require a shared staging API environment
#   - take longer and are more flake-prone than unit tests
#   - cover cross-platform interoperability (e.g. register on iOS, accept
#     beneficiary invitation on Android) that per-PR CI cannot cheaply cover
#
# The workflow can also be triggered manually (workflow_dispatch) to gate a
# release or debug a specific failure without waiting for the schedule.

on:
  schedule:
    # 04:00 UTC daily — off-peak, avoids clashing with business-hours CI runs.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      staging_api_url:
        description: "Override the staging API base URL (leave blank to use the default)"
        required: false
        default: ""

# Prevent concurrent runs from racing on the same staging database.
concurrency:
  group: e2e-cross-platform
  cancel-in-progress: false

env:
  # Default staging endpoint. Override via the workflow_dispatch input or by
  # setting the E2E_API_BASE_URL repository secret.
  E2E_API_BASE_URL: ${{ inputs.staging_api_url || secrets.E2E_API_BASE_URL || 'https://staging.ethos-protocol.app' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Verify the staging API is reachable before spending simulator time.
  # ---------------------------------------------------------------------------
  preflight:
    name: Staging API preflight
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.resolve.outputs.api_url }}
    steps:
      - name: Resolve API URL
        id: resolve
        run: echo "api_url=$E2E_API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Check staging API health
        run: |
          echo "Checking $E2E_API_BASE_URL/health …"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$E2E_API_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then
            echo "❌ Staging API returned HTTP $HTTP — aborting E2E run."
            exit 1
          fi
          echo "✅ Staging API is healthy (HTTP 200)."

  # ---------------------------------------------------------------------------
  # 2. iOS E2E — build the app and run the cross-platform test suite against
  #    the shared staging API via XCUITest / XCTest.
  # ---------------------------------------------------------------------------
  ios-e2e:
    name: iOS E2E
    runs-on: macos-latest
    needs: preflight
    defaults:
      run:
        working-directory: ios/EthosProtocol
    env:
      API_BASE_URL: ${{ needs.preflight.outputs.api_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p Xcode
          xcodegen generate --project Xcode

      # Inject the staging API URL as an Info.plist override so the app under
      # test talks to staging, not whatever URL was baked into the build.
      - name: Build E2E app for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            API_BASE_URL="$API_BASE_URL"

      - name: Run cross-platform E2E tests (iOS side)
        run: |
          xcodebuild test-without-building \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:EthosProtocolE2ETests \
            -skipMacroValidation \
            E2E_API_BASE_URL="$API_BASE_URL" \
            TEST_RUNNER_E2E_API_BASE_URL="$API_BASE_URL"

      - name: Upload iOS E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-results
          path: ios/EthosProtocol/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Android E2E — build the debug APK + test APK and run them on the
  #    Android Emulator via Instrumented tests (Espresso / UI Automator).
  # ---------------------------------------------------------------------------
  android-e2e:
    name: Android E2E
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: android
    env:
      API_BASE_URL: ${{ needs.preflight.outputs.api_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build the app APK and the androidTest APK with the staging URL injected
      # via a Gradle property so Instrumentation tests hit staging, not prod.
      - name: Build debug APK + test APK
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -Pe2eApiBaseUrl="$API_BASE_URL"

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android E2E tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            cd android
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.ethosprotocol.e2e.CrossPlatformE2ETest \
              -Pe2eApiBaseUrl="$E2E_API_BASE_URL"

      - name: Upload Android E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Full beneficiary acceptance flow — vault creation → invitation link →
  #    beneficiary opens link → acceptance succeeds.
  #
  #    This exists specifically because #109/#195 (Android forwarded the wrong
  #    beneficiary token when the invitation deep link was opened cold, i.e.
  #    the app was not already running) slipped past unit coverage
  #    (BeneficiaryAcceptanceTest.kt, AcceptanceViewModelTest.kt only exercise
  #    the ViewModel/service layer with a token already in hand — they never
  #    exercise the deep-link → token-extraction → network-call path end to
  #    end). This job drives the real deep link on a real
  #    (simulator/emulator) OS deep-link dispatcher against a shared staging
  #    fixture, so a regression in *which* token gets forwarded is caught the
  #    same way a real beneficiary would trigger it.
  # ---------------------------------------------------------------------------
  acceptance-flow-fixture:
    name: Seed shared acceptance-flow fixture
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      vault_id: ${{ steps.seed.outputs.vault_id }}
      invitation_token: ${{ steps.seed.outputs.invitation_token }}
      invitation_url: ${{ steps.seed.outputs.invitation_url }}
    env:
      API_BASE_URL: ${{ needs.preflight.outputs.api_url }}
    steps:
      - uses: actions/checkout@v7

      # Creates one vault + one beneficiary invitation against the shared
      # staging backend and hands the resulting deep-link URL (with its real
      # token) to both platform jobs, so iOS and Android are exercised
      # against the *exact same* invitation rather than two independently
      # generated ones. This mirrors production: one vault owner, one
      # invitation, opened by one beneficiary.
      - name: Create vault and beneficiary invitation
        id: seed
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "$API_BASE_URL/e2e-fixtures/vault-with-invitation" \
            -H "Content-Type: application/json" \
            -d '{"scenario": "acceptance-flow-e2e"}')
          VAULT_ID=$(echo "$RESP" | jq -r '.vault_id')
          TOKEN=$(echo "$RESP" | jq -r '.invitation_token')
          URL=$(echo "$RESP" | jq -r '.invitation_url')
          echo "vault_id=$VAULT_ID" >> "$GITHUB_OUTPUT"
          echo "invitation_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "invitation_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Seeded vault $VAULT_ID with invitation token ${TOKEN:0:8}…"

  acceptance-flow-ios:
    name: iOS — beneficiary acceptance flow
    runs-on: macos-latest
    needs: [preflight, acceptance-flow-fixture]
    defaults:
      run:
        working-directory: ios/EthosProtocol
    env:
      API_BASE_URL: ${{ needs.preflight.outputs.api_url }}
      E2E_INVITATION_URL: ${{ needs.acceptance-flow-fixture.outputs.invitation_url }}
      E2E_INVITATION_TOKEN: ${{ needs.acceptance-flow-fixture.outputs.invitation_token }}
      E2E_VAULT_ID: ${{ needs.acceptance-flow-fixture.outputs.vault_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p Xcode
          xcodegen generate --project Xcode

      - name: Build E2E app for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            API_BASE_URL="$API_BASE_URL"

      # Boots a clean (cold) simulator and opens the invitation link via
      # `xcrun simctl openurl`, exactly as iOS Mail/Messages/Safari would.
      # Opening it cold — before the app process exists — is what the
      # #109/#195 class of bug requires to reproduce, since a warm-start
      # deep link takes a different code path that already had coverage.
      - name: Boot clean simulator
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase "iPhone 16" || true
          xcrun simctl boot "iPhone 16"

      - name: Run acceptance-flow E2E test (cold deep link)
        run: |
          xcodebuild test-without-building \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:EthosProtocolE2ETests/BeneficiaryAcceptanceFlowE2ETests/testColdDeepLinkAcceptanceSucceedsWithCorrectToken \
            -skipMacroValidation \
            E2E_API_BASE_URL="$API_BASE_URL" \
            E2E_INVITATION_URL="$E2E_INVITATION_URL" \
            E2E_INVITATION_TOKEN="$E2E_INVITATION_TOKEN" \
            E2E_VAULT_ID="$E2E_VAULT_ID" \
            TEST_RUNNER_E2E_API_BASE_URL="$API_BASE_URL" \
            TEST_RUNNER_E2E_INVITATION_URL="$E2E_INVITATION_URL" \
            TEST_RUNNER_E2E_INVITATION_TOKEN="$E2E_INVITATION_TOKEN"

      # Independently confirms server-side acceptance state, so the test
      # fails even if the client silently swallowed a wrong-token error.
      - name: Verify beneficiary acceptance recorded server-side
        run: |
          set -euo pipefail
          STATUS=$(curl -sf "$API_BASE_URL/e2e-fixtures/vaults/$E2E_VAULT_ID/beneficiary-status" | jq -r '.status')
          echo "Server-side beneficiary status: $STATUS"
          [ "$STATUS" = "accepted" ]

  acceptance-flow-android:
    name: Android — beneficiary acceptance flow
    runs-on: ubuntu-latest
    needs: [preflight, acceptance-flow-fixture]
    defaults:
      run:
        working-directory: android
    env:
      API_BASE_URL: ${{ needs.preflight.outputs.api_url }}
      E2E_INVITATION_URL: ${{ needs.acceptance-flow-fixture.outputs.invitation_url }}
      E2E_INVITATION_TOKEN: ${{ needs.acceptance-flow-fixture.outputs.invitation_token }}
      E2E_VAULT_ID: ${{ needs.acceptance-flow-fixture.outputs.vault_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK + test APK
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -Pe2eApiBaseUrl="$API_BASE_URL"

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `am start -a android.intent.action.VIEW -d <uri>` against a
      # freshly-installed (never-launched) app is the Android equivalent of
      # the iOS cold-boot deep link above: it forces the token to travel
      # through onCreate()/getIntent() rather than onNewIntent(), which is
      # the exact path where #109/#195 forwarded a stale/wrong token.
      - name: Run Android acceptance-flow E2E tests on emulator (cold deep link)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            cd android
            adb uninstall com.ethosprotocol || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.ethosprotocol.e2e.BeneficiaryAcceptanceFlowE2ETest#testColdDeepLinkAcceptanceForwardsCorrectToken \
              -Pe2eApiBaseUrl="$API_BASE_URL" \
              -PtestInvitationUrl="$E2E_INVITATION_URL" \
              -PtestInvitationToken="$E2E_INVITATION_TOKEN" \
              -PtestVaultId="$E2E_VAULT_ID"

      - name: Verify beneficiary acceptance recorded server-side
        run: |
          set -euo pipefail
          STATUS=$(curl -sf "$API_BASE_URL/e2e-fixtures/vaults/$E2E_VAULT_ID/beneficiary-status" | jq -r '.status')
          echo "Server-side beneficiary status: $STATUS"
          [ "$STATUS" = "accepted" ]

      - name: Upload Android acceptance-flow E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-acceptance-flow-e2e-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5. Offline → online sync flow — go offline, queue a check-in, come back
  #    online, verify the *server-side* state matches what was queued.
  # ---------------------------------------------------------------------------
  offline-sync-flow-android:
    name: Android — offline check-in sync flow
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: android
    env:
      API_BASE_URL: ${{ needs.preflight.outputs.api_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK + test APK
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -Pe2eApiBaseUrl="$API_BASE_URL"

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Real WorkManager scheduling (not the unit-test WorkManager test
      # driver) is what actually enqueues PendingActionSyncWorker while the
      # emulator's network is toggled off/on via `adb shell svc`. Unit
      # tests mock this scheduling away entirely, so this is the only place
      # that exercises the real constraint (NetworkType.CONNECTED) firing
      # the worker once connectivity returns.
      - name: Run offline/online check-in sync E2E test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            cd android
            adb shell svc data disable
            adb shell svc wifi disable
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.ethosprotocol.e2e.OfflineCheckInSyncE2ETest#testCheckInQueuedOfflineSyncsWhenBackOnline \
              -Pe2eApiBaseUrl="$API_BASE_URL"
            adb shell svc data enable
            adb shell svc wifi enable

      - name: Upload offline-sync E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-offline-sync-e2e-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  offline-sync-flow-ios:
    name: iOS — offline check-in sync flow
    runs-on: macos-latest
    needs: preflight
    defaults:
      run:
        working-directory: ios/EthosProtocol
    env:
      API_BASE_URL: ${{ needs.preflight.outputs.api_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p Xcode
          xcodegen generate --project Xcode

      - name: Build E2E app for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            API_BASE_URL="$API_BASE_URL"

      # `simctl` network toggling for BGProcessingTask is a proxy: BGTask
      # scheduling itself cannot be fully forced in CI, so the test invokes
      # the real BGProcessingTaskScheduler registration/handler pair
      # directly (as Apple's own testing guidance recommends) while the
      # simulator is network-disabled, then re-enables networking and
      # confirms the task drains the real queue against the real API.
      - name: Disable simulator network
        run: xcrun simctl status_bar "iPhone 16" override --cellularBars 0 || true

      - name: Run offline/online check-in sync E2E test (CheckInSyncTask)
        run: |
          xcodebuild test-without-building \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:EthosProtocolE2ETests/OfflineCheckInSyncE2ETests/testCheckInQueuedOfflineSyncsWhenBackOnline \
            -skipMacroValidation \
            E2E_API_BASE_URL="$API_BASE_URL" \
            TEST_RUNNER_E2E_API_BASE_URL="$API_BASE_URL"

      # NOTE: deposit/withdraw offline queuing is intentionally not covered
      # here yet — tracked behind #240. Once #240 ships, add a
      # `testDepositQueuedOfflineSyncsWhenBackOnline` case following the
      # same pattern as the check-in test above, reusing this same job.

  # ---------------------------------------------------------------------------
  # 6. Summary — single job reviewers can watch for pass/fail.
  # ---------------------------------------------------------------------------
  e2e-summary:
    name: E2E summary
    runs-on: ubuntu-latest
    needs:
      [
        ios-e2e,
        android-e2e,
        acceptance-flow-ios,
        acceptance-flow-android,
        offline-sync-flow-android,
        offline-sync-flow-ios,
      ]
    if: always()
    steps:
      - name: Report result
        run: |
          IOS="${{ needs.ios-e2e.result }}"
          ANDROID="${{ needs.android-e2e.result }}"
          ACCEPTANCE_IOS="${{ needs.acceptance-flow-ios.result }}"
          ACCEPTANCE_ANDROID="${{ needs.acceptance-flow-android.result }}"
          OFFLINE_ANDROID="${{ needs.offline-sync-flow-android.result }}"
          OFFLINE_IOS="${{ needs.offline-sync-flow-ios.result }}"
          echo "iOS E2E:                  $IOS"
          echo "Android E2E:               $ANDROID"
          echo "iOS acceptance flow:       $ACCEPTANCE_IOS"
          echo "Android acceptance flow:   $ACCEPTANCE_ANDROID"
          echo "Android offline sync flow: $OFFLINE_ANDROID"
          echo "iOS offline sync flow:     $OFFLINE_IOS"
          for r in "$IOS" "$ANDROID" "$ACCEPTANCE_IOS" "$ACCEPTANCE_ANDROID" "$OFFLINE_ANDROID" "$OFFLINE_IOS"; do
            if [ "$r" != "success" ]; then
              echo "❌ One or more E2E suites failed."
              exit 1
            fi
          done
          echo "✅ All E2E suites passed."
