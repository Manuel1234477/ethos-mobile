name: iOS App Links Verification

on:
  push:
    branches: [main]
    paths:
      # Re-run if the entitlements or the verification script changes
      - "ios/EthosProtocol/EthosProtocol/EthosProtocol.entitlements"
      - "scripts/verify_apple_app_site_association.sh"
  pull_request:
    branches: [main]
    paths:
      - "ios/EthosProtocol/EthosProtocol/EthosProtocol.entitlements"
      - "scripts/verify_apple_app_site_association.sh"
  # Daily scheduled run catches any server-side drift in apple-app-site-association
  # without needing a code push.
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:       # allow manual re-runs

jobs:
  verify-aasa:
    name: Verify apple-app-site-association (Universal Links / Passkeys)
    runs-on: ubuntu-latest
    # The "Alert on failure" step below files a GitHub issue on scheduled-run
    # failures, which needs issues:write — the default GITHUB_TOKEN is
    # read-only, so without this the alert itself fails with a 403.
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify apple-app-site-association
        env:
          # APPLE_TEAM_IDENTIFIER should be set as a repository variable.
          # Value format: Apple Developer Team ID (e.g., "ABCDEFGHIJ")
          # Leave unset to skip App ID verification (fetch + JSON checks will still run).
          TEAM_IDENTIFIER: ${{ vars.APPLE_TEAM_IDENTIFIER }}
        run: bash scripts/verify_apple_app_site_association.sh

      # The check stays red for as long as the hosted file is wrong (or the domain
      # isn't live yet), so filing a fresh issue on every scheduled run buried the
      # tracker in duplicates. Comment on the open alert instead, and only open a
      # new one when none exists.
      - name: Alert on failure (scheduled run)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "⚠️ apple-app-site-association verification failed (scheduled check)";

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            if (existing.data.items.some(issue => issue.title === title)) {
              console.log("An open alert issue already exists — skipping creation to avoid duplicates.");
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body: [
                "The daily iOS App Links verification job failed.",
                "",
                "This means Universal Links (deep-link routing to the app) or Platform Passkeys",
                "may not resolve correctly. Users tapping `https://ethos-protocol.app/accept?vault_id=...`",
                "may be routed to the browser instead of the app, and passkey registration/authentication",
                "may fail.",
                "",
                `Workflow run: ${runUrl}`,
                "",
                "Possible causes:",
                "- `ethos-protocol.app` not resolving yet (no DNS record / domain not live)",
                "- apple-app-site-association removed or unreachable (HTTP non-200)",
                "- apple-app-site-association file is not valid JSON",
                "- `applinks` section missing or does not list the app's Team ID + Bundle ID",
                "- `webcredentials` section missing or does not list the app's Team ID + Bundle ID",
                "- Cert or other configuration changed without updating the file",
                "",
                "Related: #63"
              ].join("\n"),
              labels: ["bug", "ios", "ci"]
            });
