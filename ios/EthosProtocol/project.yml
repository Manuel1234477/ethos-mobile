# XcodeGen spec for EthosProtocol.
#
# This generates the real, installable .xcodeproj (app target + WidgetKit
# extension) that the hand-maintained Package.swift cannot produce on its
# own (SwiftUI `@main App` needs to be compiled into an executable app
# target, not linked in as an SPM library product).
#
# Usage:
#   brew install xcodegen   # macOS, e.g. on a GitHub Actions macos-latest runner
#   cd ios/EthosProtocol
#   xcodegen generate --project Xcode
#   open Xcode/EthosProtocol.xcodeproj
#
# NOTE: the generated project is deliberately written to a `Xcode/`
# subdirectory (via `--project Xcode`) rather than next to Package.swift.
# Keeping this directory free of an .xcodeproj means `xcodebuild`/`swift test`
# invocations that rely on implicit SPM package discovery (i.e. that don't
# pass -project/-workspace) keep resolving unambiguously to Package.swift,
# so the existing `EthosProtocolTests` XCTest target keeps working exactly
# as it did before this file existed. See ios-ci.yml and the root README
# for how the two build systems (SPM for tests, Xcode project for the real
# app + widget) are kept side by side.

name: EthosProtocol

configs:
  Debug: debug
  Release: release
  # Staging mirrors Release (minification on, pinning configurable) but points at
  # the staging API endpoint. API_BASE_URL and TLS_PUBLIC_KEY_PINS are overridden
  # per-target in the settings.configs block below. The Staging configuration uses
  # the same underlying xcode-configuration type as Release so that it inherits all
  # release optimisations and catches ProGuard-equivalent dead-code stripping issues
  # before a production build is cut.
  Staging: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # TODO(team): set your Apple Developer Team ID before building/archiving,
    # either here or by picking a team in Xcode's Signing & Capabilities tab
    # for each target. Find it at https://developer.apple.com/account/#/membership.
    # Deliberately left blank — do NOT fill this in with a placeholder/fake ID.
    DEVELOPMENT_TEAM: ""
    # #170/#593: certificate pins for api.ethos-protocol.app. Both Info.plists expand
    # these into their TLS_PUBLIC_KEY_PINS array, so a pin rotation is a build-setting
    # change rather than a plist edit, and can differ per build configuration.
    #
    # The pin set is single-sourced in shared/cert-pins.json. Do NOT hand-edit the
    # values below: .github/scripts/generate_cert_pins.py reads that JSON and rewrites
    # these two lines (and the Android buildConfigField in android/app/build.gradle.kts)
    # so both platforms stay in sync. Rotate a pin by editing shared/cert-pins.json and
    # re-running the generator, then commit the regenerated files.
    #
    #   python3 .github/scripts/generate_cert_pins.py
    #
    # The generated values can still be overridden on the build invocation (or in
    # Xcode's build settings / an .xcconfig) if needed:
    #
    #   xcodebuild -configuration Release \
    #     TLS_PUBLIC_KEY_PIN_CURRENT=<base64 SPKI SHA-256> \
    #     TLS_PUBLIC_KEY_PIN_BACKUP=<base64 SPKI SHA-256>
    #
    # Left blank here on purpose: PinningDelegate ignores empty entries, so an
    # unconfigured build has pinning disabled (the documented local-dev behavior).
    # Release builds are gated by .github/scripts/check_tls_pinning.py, which also
    # asserts the generated iOS and Android pin sets match.
    TLS_PUBLIC_KEY_PIN_CURRENT: ""
    TLS_PUBLIC_KEY_PIN_BACKUP: ""

targets:
  EthosProtocol:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
      - path: Sources/Models
      - path: Sources/Services
      - path: Sources/ViewModels
      - path: Sources/Views
    info:
      # INFOPLIST_FILE and CODE_SIGN_ENTITLEMENTS are both plain SRCROOT-
      # relative build settings. SRCROOT is the generated .xcodeproj's own
      # directory (Xcode/, via --project Xcode), one level below where this
      # file actually lives, so both need an explicit ../ to resolve.
      path: ../EthosProtocol/Info.plist
    entitlements:
      path: ../EthosProtocol/EthosProtocol.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethosprotocol
        PRODUCT_NAME: EthosProtocol
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Staging: point at the staging API and use a distinct bundle ID so the
        # staging and production apps can be installed side-by-side on a device.
        # API_BASE_URL is injected at build time via xcodebuild's
        # `STAGING_API_BASE_URL` xcconfig/command-line override; it falls back to
        # the staging subdomain if not supplied (so the plist is never blank).
        # TLS pins are left empty: the staging certificate is separate from
        # production and check_tls_pinning.py only gates the Release configuration.
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.ethosprotocol.staging
          PRODUCT_NAME: "EthosProtocol Staging"
          # Expand from a build setting so CI can inject it without editing this file:
          #   xcodebuild -configuration Staging STAGING_API_BASE_URL=https://...
          # Falls back to the staging subdomain convention when not set.
          STAGING_API_BASE_URL: "https://staging-api.ethos-protocol.app/v1"
    dependencies:
      - target: TTLWidget
        embed: true
        codeSign: true

  # WidgetKit extension. Its Swift files (Sources/Widget/TTLWidget.swift) call
  # APIClient.shared.listVaults() and reference the Vault model directly, with
  # no `import EthosProtocol` — i.e. the code was written assuming Models and
  # Services compile as part of the *same module* as the widget, not as a
  # separate importable library (there's no framework product in this native
  # project the way there was with the old Package.swift library products).
  # So — deliberately deviating from "sources: Sources/Widget only" — this
  # target also compiles Sources/Models plus the specific Services files it
  # needs directly (dual target membership with the app target, which is a
  # normal/supported Xcode pattern) so it builds standalone. See the sources
  # list below for exactly which Services files and why.
  TTLWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
      - path: Sources/Models
      # Only the specific Services files TTLWidget.swift's APIClient.listVaults()
      # call transitively needs (verified by grep) — NOT the whole Services
      # directory. NotificationService.swift (UIApplication.shared) and
      # BackgroundRefreshService.swift (BGTaskScheduler) use app-only APIs
      # that are unavailable when compiled into an app-extension target and
      # fail to build; BiometricService/PasskeyService/UniversalLinkRouter/
      # ICloudSyncService are simply unused here.
      - path: Sources/Services/APIClient.swift
      - path: Sources/Services/KeychainService.swift
      - path: Sources/Services/OfflineSupport.swift
      # APIClient.execute() retries idempotent GET requests through withRetry(),
      # defined here.
      - path: Sources/Services/RetryPolicy.swift
      # APIClient.decode() logs decode failures through this.
      - path: Sources/Services/DecodingFailureLogger.swift
      # APIClient's private convenience init() builds its URLSession with a
      # PinningDelegate, defined here.
      - path: Sources/Services/CertificatePinning.swift
    info:
      # See the EthosProtocol target's info.path comment above.
      path: ../TTLWidget/Info.plist
    entitlements:
      path: ../TTLWidget/TTLWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethosprotocol.TTLWidget
        PRODUCT_NAME: TTLWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
      configs:
        # Staging: distinct bundle ID to match the .staging host app suffix.
        # TTLWidget reads API_BASE_URL from its own Info.plist (Bundle.main resolves
        # to the extension bundle, not the host app), so the staging URL must also
        # be set here. The Info.plist API_BASE_URL key is overridden at build time
        # via the STAGING_API_BASE_URL xcconfig/command-line setting (same as the
        # host app target above).
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.ethosprotocol.staging.TTLWidget
          PRODUCT_NAME: "TTLWidget Staging"
          STAGING_API_BASE_URL: "https://staging-api.ethos-protocol.app/v1"

  EthosProtocolTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/HostedTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethosprotocol.tests
        PRODUCT_NAME: EthosProtocolTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EthosProtocol.app/EthosProtocol
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EthosProtocol

# The SPM-based test bundle (Package.swift) remains the primary test target for
# fast unit tests that don't require a real app host process (model tests, service
# mocks, etc). The hosted EthosProtocolTests target above is used only for tests
# that require real Keychain access (KeychainService) or UNUserNotificationCenter
# (NotificationService/BackgroundRefreshService), which are skipped from CI in the
# SPM bundle due to "no host app" limitations. Both test bundles coexist and are
# run in CI — see ios-ci.yml for how they're orchestrated.
